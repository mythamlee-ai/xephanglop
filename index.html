 if(!(S.rule.max>0))S.rule.max=10;if(!Array.isArray(S.subjects)||!S.subjects.length)S.subjects=['Toán','Lí','Hóa','Sinh','Văn','Sử','Địa','Ngoại ngữ','GDQP','Tin'];if(!Array.isArray(S.periods)||!S.periods.length){S.periods=[];['HK1','HK2'].forEach(h=>{for(let i=1;i<=4;i++)S.periods.push(h+'-KTTX'+i);S.periods.push(h+'-GK',h+'-CK')})}
 if(!S.defF||typeof S.defF!='object')S.defF=null;S.scores.forEach(x=>{if(typeof x.v=='string'){const n=+x.v.replace(',','.');x.v=x.v.trim()!==''&&isFinite(n)?n:null}});S.vars=S.vars.filter(k=>!['VP','TH','NQ'].includes(k));Object.keys(S.cfg).forEach(k=>cfg(k))}
function diag(){const L=[],add=(lv,m,fix)=>L.push({lv,m,fix}),sid=new Set(S.students.map(s=>s.id)),subs=new Set(S.subjects),pers=new Set(S.periods);
 const a=S.students.filter(s=>!S.classes.some(c=>c.id==s.cid)).length;if(a)add('warn',a+' học sinh không thuộc lớp nào (xem bảng “Tất cả học sinh” bên dưới để xóa)');
 const o1=S.scores.filter(x=>!sid.has(x.sid)).length;if(o1)add('err',o1+' điểm thuộc học sinh không còn tồn tại','orphanScores');
 const o2=S.scores.filter(x=>sid.has(x.sid)&&(!subs.has(x.sub)||!pers.has(x.per))).length;if(o2)add('err',o2+' điểm thuộc môn hoặc đợt không còn trong danh sách','badKeyScores');
 const o3=S.scores.filter(x=>x.v!=null&&(typeof x.v!='number'||!isFinite(x.v)||x.v<0||x.v>S.rule.max)).length;if(o3)add('err',o3+' điểm không hợp lệ (không phải số hoặc ngoài 0–'+S.rule.max+')','badValScores');
 const seen=new Set();let dup=0;S.scores.forEach(x=>{const k=[x.sid,x.sub,x.per,x.t].join('|');if(seen.has(k))dup++;seen.add(k)});if(dup)add('err',dup+' bản ghi điểm trùng (cùng học sinh, môn, đợt)','dupScores');
 Object.keys(S.cfg).forEach(p=>{const c=cfg(p);if(c.col.startsWith('F:')&&!c.frm.some(f=>f.id==c.col.slice(2)))add('err','Đợt '+p+': cột xếp hạng trỏ tới công thức không còn','fixCol');const bs=c.subs.filter(x=>!subs.has(x));if(bs.length)add('warn','Đợt '+p+': môn không còn trong danh sách: '+bs.join(', '),'fixSubs');
  if(c.mode=='weighted'&&c.subs.some(x=>!(c.w[x]>0)))add('warn','Đợt '+p+': TB có trọng số nhưng thiếu hệ số cho một số môn');
  c.frm.forEach(f=>{try{const o={};['TB',...S.subjects.map(slug),'VP','TH','NQ',...S.vars].forEach((k,i)=>o[k]=2+i*.37);evalExpr(f.expr,o)}catch(x){add('err','Đợt '+p+': công thức “'+f.name+'” lỗi: '+x.message)}})});
 if(ctx.cid&&ctx.per){const P=rank(ctx.cid,ctx.per,null,true),c=cfg(ctx.per),n=S.students.filter(s=>s.cid==ctx.cid&&s.status=='active').length,ns=S.scores.filter(x=>x.per==ctx.per&&S.students.some(s=>s.id==x.sid&&s.cid==ctx.cid)).length;
  add('info','Lớp/đợt đang chọn ('+ctx.per+'): '+n+' học sinh đang học, '+ns+' điểm, '+P.ok.length+' học sinh đủ dữ liệu xếp hạng, đợt '+(c.ok?'đã':'CHƯA')+' xác nhận'+(c.lock?', đã khóa':''));
  if(!ns)add('warn','Đợt '+ctx.per+' của lớp này chưa có điểm nào. Hãy kiểm tra bạn đã chọn đúng LỚP và ĐỢT ở thanh phía trên khi nhập điểm.');
  if(ns&&!P.ok.length)add('err','Có điểm nhưng chưa học sinh nào đủ dữ liệu xếp hạng: xem khung “Kiểm tra trước khi xác nhận” ở mục Công thức tính điểm')}
 {const ne=S.events.filter(x=>!x.per).length;if(ne)add('warn',ne+' bản ghi nội quy chưa gắn đợt nên không được tính (xóa hoặc nhập lại ở đúng đợt)')}
 errLog.slice(-5).forEach(x=>add('err','Lỗi chương trình gần đây: '+x));return L}
function refreshScores(sid){document.querySelectorAll('[data-tb="'+sid+'"]').forEach(td=>td.textContent=fmt(total(sid,ctx.per)?.v));document.querySelectorAll('[data-rk]').forEach(td=>td.textContent='—')}
const hashStr=s=>{let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return 'h'+(h>>>0).toString(16)+'_'+s.length};
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-a]');if(b){ev.preventDefault();if(A[b.dataset.a])Promise.resolve().then(()=>A[b.dataset.a](b.dataset.p)).catch(er=>{errLog.push(er.message);toast('Lỗi: '+er.message,1)})}});
if(typeof window!='undefined'){window.addEventListener('unhandledrejection',ev=>{const m=(ev.reason&&ev.reason.message)||String(ev.reason);errLog.push(m);toast('Lỗi: '+m,1)});window.addEventListener('error',ev=>{errLog.push(ev.message);toast('Lỗi: '+ev.message,1)})}
document.addEventListener('change',async ev=>{const t=ev.target,c=t.dataset.c;if(!c)return;
 if(c=='cid'||c=='per'||c=='sub'){ctx[c]=t.value;ui.pg=0;if(ui.imp)ui.imp.res=null;return draw()}
 if(c=='q'){ui.q=t.value;ui.pg=0;draw();const i=document.querySelector('[data-c=q]');i.focus();i.setSelectionRange(99,99);return}
 if(c=='lq'){ui.lq=t.value;draw();const i=document.querySelector('[data-c=lq]');i.focus();i.setSelectionRange(99,99);return}
 if(c=='ls'){ui.ls=t.value;return draw()}
 if(c=='arch'){ui.arch=t.checked;return draw()}
 if(c=='sc'){const g=cfg(ctx.per);if(g.lock){toast('Đợt đã khóa. Mở khóa ở mục Công thức.',1);return draw()}
  const[sid,ty,sb]=t.dataset.p.split('|'),sub=sb||ctx.sub||S.subjects[0],raw=t.value.trim();let o=S.scores.find(z=>z.sid==sid&&z.sub==sub&&z.per==ctx.per&&z.t==ty);
  if(raw===''){if(!o)return;S.scores=S.scores.filter(z=>z!=o);g.ok=false;await repo.commit('score_clear',`${sid}/${sub}/${ctx.per}: ${o.v}→trống`);return refreshScores(sid)}
  const v=num(raw);if(isNaN(v)||v<0||v>S.rule.max){toast('Điểm phải là số từ 0 đến '+S.rule.max,1);return draw()}
  const old=o?o.v:null;if(old===v)return;if(o)o.v=v;else S.scores.push({id:uid(),sid,sub,per:ctx.per,t:ty,v});g.ok=false;await repo.commit('score_set',`${sid}/${sub}/${ctx.per}: ${old??'trống'}→${v}`);return refreshScores(sid)}
 if(cfgChange(t,c))return;
 if(c=='w'||c=='max'){const v=num(t.value);if(isNaN(v)||v<=0){toast('Giá trị phải > 0',1);return draw()}c=='w'?S.rule.w[t.dataset.p]=v:S.rule.max=v;S.rule.confirmed=false;await repo.commit('rule_change',JSON.stringify(S.rule));return draw()}
 if(c=='tie'||c=='req'){c=='tie'?S.rule.tie=t.value:S.rule.requireAll=t.checked;S.rule.confirmed=false;await repo.commit('rule_change',c);return draw()}
 if(c=='nqv'){ui.nqv=t.value;if(ui.imp)ui.imp.res=null;return draw()}
 if(c=='gq'){ui.gq=t.value;draw();const i=document.querySelector('[data-c=gq]');i.focus();i.setSelectionRange(99,99);return}
 if(c=='yf'){ui.yf=t.value;return draw()}
 if(c=='fpre'){ui.fpre=t.value;return draw()}
 if(c=='npre'){ui.npre=t.value;return draw()}
 if(c=='pairfile'){const f=t.files[0];t.value='';if(!f)return;if(typeof XLSX=='undefined')return toast('Không tải được thư viện Excel (cần mạng)',1);try{const wb=XLSX.read(await f.arrayBuffer());await addPairsFromRows(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:'',raw:false}))}catch(x){toast('Không đọc được tệp: '+x.message,1)}return}
 if(c=='roster'){const f=t.files[0],cid=t.dataset.p;t.value='';if(!f)return;if(typeof XLSX=='undefined')return toast('Không tải được thư viện đọc Excel (cần mạng)',1);
  try{const wb=XLSX.read(await f.arrayBuffer()),a=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:'',raw:false}),R=parseRoster(a);if(R.err)return toast(R.err,1);A.addRoster(R.list,cid)}catch(x){toast('Không đọc được tệp: '+x.message,1)}return}
 if(c=='kind'){ui.kind=t.value;if(ui.imp)loadSheet(ui.imp);return draw()}
 if(c=='file'){ui.impErr='';ui.done=null;const f=t.files[0];if(!f)return;if(typeof XLSX=='undefined'){ui.impErr='Không tải được thư viện đọc Excel (cần kết nối mạng).';toast(ui.impErr,1);return draw()}
  try{const buf=await f.arrayBuffer();const I={name:f.name,wb:XLSX.read(buf),hash:hashStr(f.name+f.size+Array.from(new Uint8Array(buf)).reduce((a,x,i)=>i%97?a:a+x,0)+f.size),F:[['code','Mã HS'],['name','Họ tên'],['cls','Lớp'],['sub','Môn'],['per','Giai đoạn'],['v','Điểm']]};I.sheet=I.wb.SheetNames[0];loadSheet(I);ui.imp=I;draw()}catch(x){ui.impErr='Không đọc được tệp: '+x.message;toast(ui.impErr,1);draw()}return}
 if(c=='sheet'){ui.imp.sheet=t.value;loadSheet(ui.imp);return draw()}
 if(c=='map'){ui.imp.map[t.dataset.p]=t.value;ui.imp.res=null;return draw()}
 if(c=='over'){ui.imp.over=t.checked;return}
 if(c=='restore'){const f=t.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!d.schema||!d.students)throw Error('Sai định dạng');if(!await conf('Phục hồi sẽ thay toàn bộ dữ liệu hiện tại. Tiếp tục?'))return;S=d;migrate();ensureShape();ensureVars();await repo.commit('restore',f.name);draw()}catch(x){toast('Phục hồi thất bại: '+x.message,1)}}});
(async()=>{S=await provider.load();if(!S){S=seed();await repo.commit('seed_demo','dữ liệu mẫu')}if(S.schema<4){migrate();await repo.commit('migrate','schema 4')}ensureShape();ensureVars();if(S.students.length&&S.students.every(s=>s.demo)&&!S.students.some(s=>s.src=='T8')){ctx.cid=loadSample(true);ctx.per=SAMPLE.per;await repo.commit('load_sample','TESTTHANGS_8')}if(addSamplePairs())await repo.commit('sample_pairs','13 cặp mẫu');draw()})();
</script></body></html>
